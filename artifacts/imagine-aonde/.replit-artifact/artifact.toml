kind = "web"
previewPath = "/"
title = "Imagine Aonde - Orlando eBook"
version = "1.0.0"
id = "artifacts/imagine-aonde"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23711

[services.development]
run = "pnpm --filter @workspace/imagine-aonde run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/imagine-aonde", "run", "build" ]
publicDir = "artifacts/imagine-aonde/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23711"
BASE_PATH = "/"
